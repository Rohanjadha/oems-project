<mat-card class="p-3">
    <h1>Add-Categories</h1>
    <mat-card-content>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-8">
                    <form class="row justify-content-center" [formGroup]="addCat" (ngSubmit)="addCategoryData()">
                        <mat-form-field appearance="outline">
                            <mat-label>Category Title</mat-label>
                            <input type="text" formControlName="title" matInput name="title">
                        </mat-form-field>
                         <mat-form-field appearance="outline">
                            <mat-label>Category Description</mat-label>
                            <textarea type="text"  formControlName="description" matInput name="description" cols="80" rows="10"></textarea>
                        </mat-form-field>
                        <div class="text-center">
                            <button mat-raised-button color="primary" [disabled]="addCat.invalid">Add Category</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </mat-card-content>
</mat-card>
