<mat-card>
    <h1 class="mt-4 mb-4 ms-3">Add New Question</h1>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form action="" class="row justify-content-center" [formGroup]="addQuestionForm" (ngSubmit)="addQuestionData()">
                    <mat-form-field appearance="outline">
                        <mat-label>Enter Question Here</mat-label>
                        <input matInput type="text" formControlName="content" name="content" >
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="w-50">
                        <mat-label>Option A</mat-label>
                        <input matInput type="text" formControlName="option1" name="option1" [(ngModel)]="addQuestion.option1">
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="w-50">
                        <mat-label>Option B</mat-label>
                        <input matInput type="text" formControlName="option2" name="option2" [(ngModel)]="addQuestion.option2" >
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="w-50">
                        <mat-label>Option C</mat-label>
                        <input matInput type="text" formControlName="option3" name="option3" [(ngModel)]="addQuestion.option3">
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="w-50">
                        <mat-label>Option D</mat-label>
                        <input matInput type="text" formControlName="option4" name="option4" [(ngModel)]="addQuestion.option4">
                    </mat-form-field>
                    <mat-form-field appearance="outline"  class="w-100">
                        <mat-label>Choose Correct Option</mat-label>
                        <mat-select formControlName="answer" name="answer">
                            <mat-option *ngIf="addQuestion.option1" [value]="addQuestion.option1">{{addQuestion.option1}} </mat-option>
                            <mat-option *ngIf="addQuestion.option2" [value]="addQuestion.option2">{{addQuestion.option2}}  </mat-option>
                            <mat-option *ngIf="addQuestion.option3" [value]="addQuestion.option3">{{addQuestion.option3}} </mat-option>
                            <mat-option *ngIf="addQuestion.option4" [value]="addQuestion.option4">{{addQuestion.option4}} </mat-option>
                        </mat-select>
                    </mat-form-field>
                    <div class="text-center mt-2 mb-3">
                        <button mat-raised-button color="accent">Add Question</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</mat-card>
