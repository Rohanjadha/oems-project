<mat-card class="p-3">
    <h1>All Categories</h1>
    <mat-card-content *ngFor="let category of categoryData ">
        <div class="conatainer">
            <div class="row justify-content-center">
                <div class="col-md-1">
                    <span class="material-icons text-danger">category</span>
                </div>
                <div class="col-md-11">
                    <h4>{{category.title}}</h4>
                    <h4>{{category.description}}</h4>
                </div>
                
            </div>
        </div>
        <div class="mt-3">
            <div class="row">
                <div class="col-md-12 text-center">
            <button mat-raised-button color="accent" [routerLink]="['/admin-dashboard/update-category/'+category.category_id]">Update Category</button>&nbsp;&nbsp;
            <button mat-raised-button color="warn" (click)="deleteCategory(category.category_id)">Delete Category</button>
        </div>
        </div>
        <mat-divider class="mt-3"></mat-divider>
        </div>
    </mat-card-content>
    
    <div class="text-center mt-5">
        <button mat-raised-button color="primary" routerLink="/admin-dashboard/add-catogeries">Add Category</button>
    </div>
</mat-card>
